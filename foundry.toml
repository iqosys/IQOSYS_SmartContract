[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# -----------------------------
# CONFORMITÉ AMF (Point 1.3)
# -----------------------------
solc_version = "0.8.20"
evm_version = "shanghai" # Ajout recommandé pour figer la version EVM

# -----------------------------
# OPTIMISATION
# -----------------------------
optimizer = true
optimizer_runs = 200
viaIR = true

# -----------------------------
# RESEAUX (Pour les scripts)
# -----------------------------
[rpc_endpoints]
amoy = "${POLYGON_AMOY_RPC_URL}"
polygon = "${POLYGON_MAINNET_RPC_URL}"

# -----------------------------
# VERIFICATION (Pour la commande --verify)
# -----------------------------
[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}" }
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }